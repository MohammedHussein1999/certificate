<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مُنشئ الشهادات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
      :root {
        --navy: #092c54;
        --blue: #1277b8;
        --orange: #f28c18;
        --paper: #fff;
        --ink: #10243e;
        --muted: #6c7e91;
        --line: #dce7ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Cairo", sans-serif;
        background:
          radial-gradient(circle at 10% 5%, #dcefff, transparent 30%),
          linear-gradient(135deg, #f5f9fc, #e8f2f8);
      }
      .app {
        max-width: 1450px;
        margin: auto;
        padding: 30px 28px 42px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 25px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-mark {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        color: white;
        font-size: 25px;
        background: var(--navy);
        border-radius: 13px 4px 13px 4px;
        box-shadow: 7px 7px 0 #f4a02a;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.2;
        font-weight: 800;
      }
      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #2f765e;
        font-size: 12px;
        font-weight: 700;
      }
      .status i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #31bd79;
      }
      .workspace {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 25px;
        direction: ltr;
        align-items: start;
      }
      .panel,
      .preview-area {
        direction: rtl;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 18px 45px rgba(9, 44, 84, 0.1);
      }
      .panel {
        padding: 22px;
        border-radius: 4px 18px 18px 18px;
      }
      .preview-area {
        padding: 24px;
        border-radius: 18px 4px 18px 18px;
        min-width: 0;
      }
      .section {
        border-bottom: 1px solid var(--line);
        padding-bottom: 20px;
        margin-bottom: 20px;
      }
      .section:last-child {
        border: 0;
        margin: 0;
        padding: 0;
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 13px;
        font-weight: 800;
        font-size: 14px;
      }
      .step {
        color: var(--orange);
        font: 800 11px "Tajawal";
        letter-spacing: 1px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        margin: 11px 0 5px;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #f8fbfd;
        color: var(--ink);
        padding: 10px 11px;
        font: 600 13px "Cairo";
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px #dff1fc;
      }
      textarea {
        min-height: 88px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .upload {
        display: block;
        text-align: center;
        border: 1px dashed #9ebfd5;
        padding: 12px;
        color: var(--blue);
        border-radius: 8px;
        cursor: pointer;
        background: #f4fbff;
        font-size: 12px;
        font-weight: 700;
      }
      .upload input {
        display: none;
      }
      .file-note {
        color: var(--muted);
        font-size: 10px;
        display: block;
        margin-top: 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      button {
        border: 0;
        border-radius: 7px;
        cursor: pointer;
        padding: 11px 8px;
        font: 800 12px "Cairo";
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 14px #092c5425;
      }
      .primary {
        grid-column: 1/-1;
        background: var(--navy);
        color: #fff;
      }
      .secondary {
        color: var(--navy);
        background: #e4f3fb;
      }
      .accent {
        color: #fff;
        background: var(--orange);
      }
      .preview-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 17px;
      }
      .preview-head h2 {
        margin: 0;
        font-size: 16px;
      }
      .preview-head span {
        color: var(--muted);
        font-size: 11px;
      }
      .canvas-wrap {
        width: 100%;
        aspect-ratio: 16/9;
        background: #d6e4ed;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: inset 0 0 0 1px #c6d9e5;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      .hint {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }
      .names-count {
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
      }
      @media (max-width: 850px) {
        .app {
          padding: 18px 14px;
        }
        .topbar {
          align-items: start;
          flex-direction: column;
        }
        .workspace {
          grid-template-columns: 1fr;
        }
        .panel {
          order: 2;
        }
        .preview-area {
          order: 1;
          padding: 14px;
        }
        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">✦</div>
          <div>
            <h1>مُنشئ الشهادات</h1>
            <p class="subtitle">أنشئ شهادات أنيقة وجاهزة للطباعة في ثوانٍ</p>
          </div>
        </div>
        <div class="status"><i></i> يعمل بالكامل داخل المتصفح</div>
      </header>
      <div class="workspace">
        <aside class="panel">
          <section class="section">
            <div class="section-title">
              <span>قالب الشهادة</span><span class="step">01</span>
            </div>
            <label class="upload"
              >رفع تصميم شهادة جديد<input
                id="templateInput"
                type="file"
                accept="image/*" /></label
            ><span class="file-note" id="fileNote"
              >القالب الحالي: pro.jpeg</span
            >
          </section>
          <section class="section">
            <div class="section-title">
              <span>بيانات الأسماء</span><span class="step">02</span>
            </div>
            <label for="nameInput">اسم الطالب الحالي</label
            ><input
              id="nameInput"
              value="محمد أحمد"
              placeholder="اكتب الاسم هنا"
            /><label for="excelInput" class="upload"
              >رفع ملف Excel أو CSV<input
                id="excelInput"
                type="file"
                accept=".xlsx,.xls,.csv" /></label
            ><span class="file-note" id="excelNote"
              >يمكنك استخدام عمود باسم «الاسم»</span
            ><label for="namesInput">أو الصق عدة أسماء، كل اسم في سطر</label
            ><textarea
              id="namesInput"
              placeholder="محمد أحمد&#10;أحمد علي&#10;محمود حسن"
            ></textarea
            ><span class="names-count" id="namesCount">اسم واحد جاهز</span>
          </section>
          <section class="section">
            <div class="section-title">
              <span>إعدادات الاسم</span><span class="step">03</span>
            </div>
            <div class="row">
              <div>
                <label for="fontInput">الخط</label
                ><select id="fontInput">
                  <option value="Cairo">Cairo</option>
                  <option value="Tajawal">Tajawal</option>
                  <option value="Arial">Arial</option>
                  <option value="serif">Serif</option>
                </select>
              </div>
              <div>
                <label for="sizeInput">الحجم (px)</label
                ><input
                  id="sizeInput"
                  type="number"
                  min="12"
                  max="240"
                  value="72"
                />
              </div>
            </div>
            <div class="row">
              <div>
                <label for="colorInput">اللون</label
                ><input id="colorInput" type="color" value="#092c54" />
              </div>
              <div>
                <label for="alignInput">المحاذاة</label
                ><select id="alignInput">
                  <option value="center">وسط</option>
                  <option value="right">يمين</option>
                  <option value="left">يسار</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div>
                <label for="xInput">X (من 0 إلى 100%)</label
                ><input
                  id="xInput"
                  type="number"
                  min="0"
                  max="100"
                  value="50"
                />
              </div>
              <div>
                <label for="yInput">Y (من 0 إلى 100%)</label
                ><input
                  id="yInput"
                  type="number"
                  min="0"
                  max="100"
                  value="53"
                />
              </div>
            </div>
          </section>
          <section class="section actions">
            <button class="primary" id="generateButton">
              تنزيل كل الصور تلقائيًا</button
            ><button class="secondary" id="pngButton">تنزيل PNG</button
            ><button class="accent" id="pdfButton">تنزيل PDF</button
            ><button class="secondary" id="zipButton">تنزيل ZIP</button>
          </section>
        </aside>
        <section class="preview-area">
          <div class="preview-head">
            <h2>المعاينة المباشرة</h2>
            <span>اسحب الاسم داخل الشهادة لتحديد مكانه</span>
          </div>
          <div class="canvas-wrap">
            <canvas id="certificateCanvas" width="1600" height="900"></canvas>
          </div>
          <p class="hint">
            مقاس التصدير: <strong>A4 أفقي</strong> ·
            <span id="previewName">محمد أحمد</span>
          </p>
        </section>
      </div>
    </main>
    <script>
      const canvas = document.querySelector("#certificateCanvas");
      const ctx = canvas.getContext("2d");
      const image = new Image();
      image.src = "./pro.jpeg";
      let template = image;
      let dragging = false;
      const $ = (id) => document.querySelector(`#${id}`);
      const controls = [
        "nameInput",
        "fontInput",
        "sizeInput",
        "colorInput",
        "alignInput",
        "xInput",
        "yInput",
      ];
      function names() {
        return $("namesInput")
          .value.split(/\r?\n/)
          .map((name) => name.trim())
          .filter(Boolean);
      }
      function draw(name = $("nameInput").value || "محمد أحمد") {
        if (!template.complete) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(template, 0, 0, canvas.width, canvas.height);
        const x = canvas.width * (+$("xInput").value / 100);
        const y = canvas.height * (+$("yInput").value / 100);
        const size = +$("sizeInput").value * (canvas.width / 1600);
        ctx.direction = "rtl";
        ctx.textAlign = $("alignInput").value;
        ctx.textBaseline = "middle";
        ctx.font = `800 ${size}px ${$("fontInput").value}`;
        ctx.fillStyle = $("colorInput").value;
        ctx.shadowColor = "rgba(255,255,255,.7)";
        ctx.shadowBlur = 4;
        ctx.fillText(name, x, y);
        ctx.shadowBlur = 0;
        $("previewName").textContent = name;
      }
      function syncName() {
        draw();
        $("namesCount").textContent =
          `${Math.max(names().length, 1)} اسم جاهز${Math.max(names().length, 1) > 1 ? "ة" : ""}`;
      }
      image.onload = () => draw();
      controls.forEach((id) => $(id).addEventListener("input", draw));
      $("namesInput").addEventListener("input", syncName);
      $("templateInput").addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
        template = new Image();
        template.onload = () => draw();
        template.src = URL.createObjectURL(file);
        $("fileNote").textContent = `القالب الحالي: ${file.name}`;
      });
      $("excelInput").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const rows = XLSX.utils.sheet_to_json(
          workbook.Sheets[workbook.SheetNames[0]],
          { header: 1 },
        );
        const header = rows.findIndex((row) =>
          row.some(
            (cell) =>
              String(cell).trim() === "الاسم" ||
              String(cell).trim().toLowerCase() === "name",
          ),
        );
        const index =
          header >= 0
            ? rows[header].findIndex(
                (cell) =>
                  String(cell).trim() === "الاسم" ||
                  String(cell).trim().toLowerCase() === "name",
              )
            : 0;
        const list = rows
          .slice(header >= 0 ? header + 1 : 0)
          .map((row) => row[index])
          .filter(Boolean)
          .map(String);
        $("namesInput").value = list.join("\n");
        if (list[0]) $("nameInput").value = list[0];
        $("excelNote").textContent =
          `تم تحميل ${list.length} اسم من ${file.name}`;
        syncName();
      });
      function blobFor(name) {
        return new Promise((resolve) => canvas.toBlob(resolve, "image/png", 1));
      }
      $("pngButton").addEventListener("click", async () => {
        const blob = await blobFor($("nameInput").value || "شهادة");
        saveBlob(blob, `${safeName($("nameInput").value)}.png`);
      });
      $("generateButton").addEventListener("click", async () => {
        const button = $("generateButton");
        button.disabled = true;
        button.textContent = "جاري تجهيز الصور...";
        try {
          const zip = new JSZip();
          const list = names();
          for (const name of list.length
            ? list
            : [$("nameInput").value || "شهادة"]) {
            draw(name);
            zip.file(`${safeName(name)}.png`, await blobFor(name));
          }
          draw();
          saveBlob(
            await zip.generateAsync({ type: "blob" }),
            "الشهادات-الصور.zip",
          );
        } finally {
          draw();
          button.disabled = false;
          button.textContent = "تنزيل كل الصور تلقائيًا";
        }
      });
      $("zipButton").addEventListener("click", async () => {
        const zip = new JSZip();
        const list = names();
        for (const name of list.length
          ? list
          : [$("nameInput").value || "شهادة"]) {
          draw(name);
          zip.file(`${safeName(name)}.png`, await blobFor(name));
        }
        draw();
        saveBlob(await zip.generateAsync({ type: "blob" }), "الشهادات.zip");
      });
      $("pdfButton").addEventListener("click", async () => {
        const list = names();
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: "landscape",
          unit: "mm",
          format: "a4",
        });
        for (let i = 0; i < (list.length || 1); i++) {
          if (i) pdf.addPage();
          draw(list[i] || $("nameInput").value || "شهادة");
          pdf.addImage(
            canvas.toDataURL("image/jpeg", 0.95),
            "JPEG",
            0,
            0,
            297,
            210,
          );
        }
        draw();
        pdf.save("الشهادات.pdf");
      });
      function safeName(value) {
        return (value || "شهادة").replace(/[\\/:*?"<>|]/g, "-").slice(0, 80);
      }
      function saveBlob(blob, name) {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }
      canvas.addEventListener("pointerdown", (event) => {
        dragging = true;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointerup", () => {
        dragging = false;
      });
      canvas.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        const rect = canvas.getBoundingClientRect();
        $("xInput").value = Math.max(
          0,
          Math.min(100, ((event.clientX - rect.left) / rect.width) * 100),
        ).toFixed(1);
        $("yInput").value = Math.max(
          0,
          Math.min(100, ((event.clientY - rect.top) / rect.height) * 100),
        ).toFixed(1);
        draw();
      });
    </script>
  </body>
</html>
